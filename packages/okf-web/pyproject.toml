[project]
name = "okf-web"
version = "0.1.0"
description = "Local web UI (HTTP API + React app) for browsing and managing OKF bundles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "okf-core",
    "okf-mcp",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
okf-web = "okf_web.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/okf_web"]
artifacts = ["src/okf_web/static"]

[tool.uv.sources]
okf-core = { workspace = true }
okf-mcp = { workspace = true }
